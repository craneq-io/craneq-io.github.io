<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CraneQ · Coming soon</title>
<meta name="description" content="An open-source tax rules engine in Lean, tracing rules back to the tax code as it changes.">
<link rel="icon" href="assets/favicon.png">

<style>
*{box-sizing:border-box}
body{margin:0;background:#fcf2dd;color:#163e37;font:1.1rem/1.5 Georgia,serif}
header,main{width:min(92%,76rem);margin:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 0;border-bottom:1px solid #b5b89b}
.brand{display:flex;align-items:center;gap:.55rem;font-size:1.8rem}
.brand img{width:3.4rem;height:3.4rem}
a{color:inherit;text-underline-offset:.25em}
main{display:grid;grid-template-columns:1fr 1.8fr;align-items:center;gap:2rem;padding:clamp(2rem,8vh,6rem) 0}
h1{font-size:clamp(3rem,6vw,6rem);font-weight:400;line-height:.98;letter-spacing:-.055em;margin:0 0 1.3rem}
p{max-width:28ch}
.hero{width:100%;height:auto;display:block;border:1px solid #d0c4a6}
@media(max-width:760px){main{grid-template-columns:1fr;gap:1rem}p{max-width:40ch}}
</style>
</head>
<body><header><span class="brand"><img src="assets/craneq.png" alt="">CraneQ</span><a href="https://github.com/craneq-io">GitHub</a></header>
<main><section><h1>Coming soon.</h1><p>We’re building an open-source tax rules engine in Lean. Follow each rule back to the tax code, and see how it changes over time.</p></section>
<img class="hero" src="assets/pond-stalk.webp" width="1536" height="1024" alt="An engraved crane wades through a pond of connected jade nodes, its beak poised at a junction."></main></body></html>
